<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A111C" media="(prefers-color-scheme: dark)" />
    <!-- Defaults; the server rewrites this block per page (apps/server/src/seo.ts) so link previews and crawlers get the right card. -->
    <!--seo-->
    <title>NextBand: Free IELTS practice with instant band scores</title>
    <meta name="description" content="Practise IELTS Speaking, Writing, Listening and Reading online. Timed tests in the real exam format, an AI examiner, and band scores for every criterion with each mistake marked." />
    <meta property="og:image" content="/og/home.png" />
    <!--/seo-->
    <meta name="application-name" content="NextBand" />
    <meta name="apple-mobile-web-app-title" content="NextBand" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico?v=nb" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=nb" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=nb" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          { "@type": "WebSite", "name": "NextBand", "url": "https://ielts.soyebjim.me/", "inLanguage": "en" },
          {
            "@type": "WebApplication",
            "name": "NextBand",
            "url": "https://ielts.soyebjim.me/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web, iOS, Android",
            "description": "Practise IELTS Speaking, Writing, Listening and Reading with timed real-format tests, an AI examiner and band scores for every criterion.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "educationalUse": "Test preparation",
            "about": { "@type": "Thing", "name": "IELTS" }
          }
        ]
      }
    </script>

    <script>
      // Apply the theme before first paint (no flash). Mirrors components/layout/ThemeToggle.tsx.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Installed app (home-screen launch): play the NextBand splash once per launch. Plain website visits never load it.
      try {
        if (matchMedia('(display-mode: standalone)').matches && !sessionStorage.getItem('nb-splash')) {
          sessionStorage.setItem('nb-splash', '1');
          var s = document.createElement('script');
          s.src = '/nextband/splash.js';
          document.head.appendChild(s);
        }
      } catch (e) {}
      // Start the session check now, in parallel with the entry bundle; lib/query.ts meQuery adopts this response.
      if (!/^\/(login|signup|forgot-password|reset-password)\b/.test(location.pathname)) (window.__me = fetch('/api/me')).catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot mark: covers the gap until the first page resolves (main.tsx removes it). Shows only if loading takes >250ms. -->
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f9fb; z-index: 50; pointer-events: none; animation: boot-in .2s .25s both; transition: opacity .2s; }
      .dark #boot { background: #0a111c; }
      #boot svg { width: 44px; height: 44px; fill: #0f766e; }
      .dark #boot svg { fill: #2dd4bf; }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
    <div id="boot" role="progressbar" aria-label="Loading NextBand">
      <svg viewBox="0 19.755 40 59.245" aria-hidden="true"><path d="M2.5 79A2.5 2.5 0 0 1 0 76.5 L0 42.865A10 10 0 0 1 4.996 34.207 L25.356 22.439A20 20 0 0 1 35.364 19.755 L37.5 19.755A2.5 2.5 0 0 1 40 22.255 L40 76.5A2.5 2.5 0 0 1 37.5 79 L32.5 79A2.5 2.5 0 0 1 30 76.5 L30 30.15 L10 41.71 L10 76.5A2.5 2.5 0 0 1 7.5 79Z"/></svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
