<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F9FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A111C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Timed IELTS Speaking and Writing practice with honest, descriptor-anchored feedback." />
    <title>IELTS Practice</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F766E'/%3E%3Cpath d='M9 20v-8M13 23V9M17 19v-6M21 22V10M25 18v-4' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />

    <script>
      // Apply the theme before first paint (no flash). Mirrors components/layout/ThemeToggle.tsx.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Start the session check now, in parallel with the entry bundle; lib/query.ts meQuery adopts this response.
      if (!/^\/(login|signup|forgot-password|reset-password)\b/.test(location.pathname)) (window.__me = fetch('/api/me')).catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
