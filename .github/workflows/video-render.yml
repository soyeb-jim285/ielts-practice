name: Video render
# Renders a HyperFrames composition on a GitHub-hosted runner (keeps the heavy render off the developer laptop).
# The composition (HTML + clips + music) is uploaded as an asset of a DRAFT release (visible only to collaborators),
# so captures and licensed music never enter the public repo. Driver: scripts/render-video-on-github.sh.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag holding composition.tar.gz
        default: video-src
      quality:
        description: draft | looks | delivery
        default: delivery

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Fetch composition from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p composition.tar.gz
          mkdir comp && tar -xzf composition.tar.gz -C comp
      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
      - name: Check and render
        env:
          QUALITY: ${{ inputs.quality }}
        working-directory: comp
        run: |
          npx -y hyperframes@0.8.113 check . || true
          npx -y hyperframes@0.8.113 render . -o ../brag.mp4 -q "$QUALITY" --video-frame-format png --workers auto
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: brag.mp4
