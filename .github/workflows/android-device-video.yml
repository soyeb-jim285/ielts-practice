name: Android device video
# Records REAL interaction clips of the debug APK on an Android emulator (GitHub-hosted, KVM): `adb shell screenrecord` runs
# while the script drives the app with adb input tap/swipe/text. Demo mode (fixtures, no server) starts each screen.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: space-separated clip functions to re-run (e.g. "clip_review clip_home:dark")'
        required: false
        default: ''

jobs:
  device-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Record on emulator
        env:
          ONLY: ${{ inputs.only }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-device-video.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-video
          path: device-video
