name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ielts
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI contract is up to date (run `pnpm gen:api` and commit)
        run: |
          pnpm gen:api
          git status --porcelain -- apps/web/src/openapi.json apps/web/src/lib/schema.d.ts | tee /dev/stderr | (! grep .)

  livekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: services/livekit/uv.lock
      - run: uv sync --frozen --python 3.13
        working-directory: services/livekit
      - run: uv run --frozen pytest
        working-directory: services/livekit
      - uses: docker/setup-buildx-action@v3
      - name: Check worker image (no push)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: services/livekit
          push: false
          cache-from: type=gha,scope=livekit
          cache-to: type=gha,mode=max,scope=livekit

  docker:
    needs: [check, livekit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/soyeb-jim285/ielts-practice:latest
            ghcr.io/soyeb-jim285/ielts-practice:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: services/voice
          push: true
          tags: |
            ghcr.io/soyeb-jim285/ielts-voice:latest
            ghcr.io/soyeb-jim285/ielts-voice:${{ github.sha }}
          cache-from: type=gha,scope=voice
          cache-to: type=gha,mode=max,scope=voice
      - name: Publish LiveKit worker
        uses: docker/build-push-action@v6
        with:
          context: services/livekit
          push: true
          tags: |
            ghcr.io/soyeb-jim285/ielts-livekit-worker:latest
            ghcr.io/soyeb-jim285/ielts-livekit-worker:${{ github.sha }}
          cache-from: type=gha,scope=livekit
          cache-to: type=gha,mode=max,scope=livekit
      # Redeploy on Dokploy only once the new image exists (Dokploy's own on-push deploy would race the build).
      # Set the repo secret DOKPLOY_DEPLOY_WEBHOOK to the compose service's webhook URL (Dokploy → Deployments).
      - name: Deploy (Dokploy webhook)
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "DOKPLOY_DEPLOY_WEBHOOK not set, skipping deploy"; exit 0; fi
          # Dokploy checks the branch the way it does for a GitHub push event, so send that shape.
          body=$(jq -nc --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" '{ref: $ref, after: $sha, head_commit: {id: $sha, message: "ci deploy"}}')
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$HOOK" -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' -d "$body")
          echo "Dokploy webhook: HTTP $code"; head -c 300 resp.txt; echo
          [ "$code" -lt 300 ]
