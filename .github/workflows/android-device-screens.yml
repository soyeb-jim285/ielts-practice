name: Android device screenshots
# Runs the real debug APK on an Android emulator (GitHub-hosted, KVM) and captures every demo screen in light and dark
# with adb screencap. Demo mode answers all requests from bundled synthetic fixtures, so no server or account is needed.
on:
  workflow_dispatch:

jobs:
  device-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-device-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-screens
          path: device-shots
