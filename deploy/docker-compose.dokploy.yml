# Production stack for Dokploy (Compose service). Set the variables in Dokploy's Environment tab (they become .env here).
# Community mode (docs/community.md) adds: KEY_ENCRYPTION_SECRET (required: `openssl rand -hex 32`; without it users cannot save their own API keys),
# and optionally COMMUNITY_MIN_BALANCE, COMMUNITY_MAX_PER_HOUR, GUEST_IP_WEEKLY_CAP, IP_HASH_SALT. OPENROUTER_API_KEY must carry a spend limit (it is the shared balance).
# Guest limits use the client IP from the Cloudflare Tunnel (CF-Connecting-IP): keep the app reachable only through the tunnel.
# Exposed through the VPS's Cloudflare Tunnel (cloudflared on dokploy-network), like the other sites there:
# public hostname ielts.soyebjim.me → http://ielts-app:8787. No host ports are published.
# R2 bucket CORS is REQUIRED: browsers PUT recordings straight to presigned R2 URLs. Cloudflare dashboard → R2 → bucket →
# Settings → CORS policy: AllowedOrigins ["https://ielts.soyebjim.me"], AllowedMethods [GET, PUT, HEAD], AllowedHeaders
# [content-type, range], ExposeHeaders [ETag, Content-Length, Content-Range, Accept-Ranges]. Without it uploads fail with
# "Couldn't reach the server" (the preflight gets 403).
# Deploys: CI (.github/workflows/ci.yml) pushes the image, then calls the DOKPLOY_DEPLOY_WEBHOOK repo secret; keep Dokploy's
# own Autodeploy off so it doesn't redeploy the old image before the build finishes.
# Memory caps keep this app from squeezing other projects on the same VPS.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ielts
    volumes:
      - ielts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    networks: [internal]

  # API + web (same origin). Migrates and seeds the prompt bank on start (docker/entrypoint.sh).
  app:
    image: ghcr.io/soyeb-jim285/ielts-practice:latest
    pull_policy: always # every deploy fetches the newest :latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ielts
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    networks:
      internal:
      dokploy-network:
        aliases: [ielts-app] # unique name the tunnel targets; "app" alone could clash with other stacks

  # Nightly pg_dump → R2 under backups/ (uses the R2_* variables).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/ielts
    volumes:
      - ../docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache aws-cli >/dev/null && exec /backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    networks: [internal]

networks:
  internal:
  dokploy-network:
    external: true

volumes:
  ielts-pgdata:
