services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ielts
      POSTGRES_DB: ielts
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
