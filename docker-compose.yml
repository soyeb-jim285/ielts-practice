services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ielts
      POSTGRES_DB: ielts
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  # API + web. Migrates and seeds the prompt bank on start (docker/entrypoint.sh).
  app:
    image: ghcr.io/soyeb-jim285/ielts-practice:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:ielts@db:5432/ielts
      NODE_ENV: production
    ports:
      - "8787:8787"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nightly pg_dump → R2 (needs R2_* in .env).
  backup:
    image: postgres:17-alpine
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:ielts@db:5432/ielts
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache aws-cli >/dev/null && exec /backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
